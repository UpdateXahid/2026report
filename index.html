<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Cafe and Coffee Insights Report | Pablo & Rusty's</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #FDF9F3; color: #2A2A2A; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .chart-container { height: 350px; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex items-center justify-center h-screen bg-[#FDF9F3]">
            <div class="text-center">
                <div class="w-12 h-12 border-4 border-[#1C355E] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-[10px] font-black uppercase tracking-widest text-[#1C355E]">Loading 2026 Report...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        // Wait for the full window load event to ensure all CDNs are attached
        window.addEventListener('load', () => {
            const { 
                BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
                PieChart, Pie, Cell, AreaChart, Area, Legend 
            } = window.Recharts;

            const { Coffee, ArrowRight, Zap } = lucide;

            const PR_COLORS = { charcoal: '#2A2A2A', blue: '#1C355E', gold: '#C5A059', rust: '#B94723' };

            const App = () => {
                const [activeTab, setActiveTab] = React.useState('intro');

                const segmentData = [
                    { name: 'Specialty Enthusiasts', value: 27, desc: 'Quality obsessed: The core growth engine.' },
                    { name: 'Casual Drinkers', value: 24, desc: 'Socially motivated.' },
                    { name: 'Engaged Mainstream', value: 20, desc: 'Balanced regulars.' },
                    { name: 'Non Category', value: 16, desc: 'Low engagement.' },
                    { name: 'Convenience Regulars', value: 14, desc: 'Routine driven.' }
                ];

                const generationalShift = [
                    { age: '18-24', hot: 38, cold: 62 },
                    { age: '25-34', hot: 52, cold: 48 },
                    { age: '35-44', hot: 65, cold: 35 },
                    { age: '45-54', hot: 78, cold: 22 },
                    { age: '55+', hot: 89, cold: 11 }
                ];

                const Card = ({ title, subtitle, children }) => (
                    <div className="bg-white p-8 border border-gray-200 rounded-sm shadow-sm mb-6">
                        <h3 className="text-sm font-black uppercase tracking-widest text-[#2A2A2A] mb-1">{title}</h3>
                        {subtitle && <p className="text-[10px] uppercase text-gray-400 font-bold mb-4 italic">{subtitle}</p>}
                        {children}
                    </div>
                );

                const Stat = ({ label, value, sub, color = '#2A2A2A' }) => (
                    <div className="flex flex-col">
                        <span className="text-[10px] uppercase font-black tracking-widest opacity-60 mb-2">{label}</span>
                        <span className="text-7xl font-black tracking-tighter leading-none" style={{ color }}>{value}</span>
                        {sub && <span className="text-[12px] mt-4 uppercase font-black text-[#2A2A2A]">{sub}</span>}
                    </div>
                );

                return (
                    <div className="min-h-screen">
                        <header className="bg-white border-b border-gray-200 sticky top-0 z-50">
                            <div className="max-w-7xl mx-auto px-10 py-6 flex justify-between items-center">
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 bg-[#1C355E] flex items-center justify-center rounded-sm text-white"><Coffee size={20}/></div>
                                    <h1 className="text-2xl font-black uppercase italic tracking-tighter">Pablo & Rusty's</h1>
                                </div>
                                <nav className="flex gap-4">
                                    {['intro', 'audiences', 'pricing'].map(tab => (
                                        <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 text-[10px] font-black uppercase tracking-widest border-b-2 transition-all ${activeTab === tab ? 'border-[#1C355E] text-[#1C355E]' : 'border-transparent text-gray-400'}`}>
                                            {tab}
                                        </button>
                                    ))}
                                </nav>
                            </div>
                        </header>

                        <main className="max-w-7xl mx-auto px-10 py-16">
                            {activeTab === 'intro' && (
                                <div className="max-w-4xl space-y-12 animate-in fade-in">
                                    <h2 className="text-8xl font-black uppercase tracking-tighter leading-none">The Structural <br/> <span className="text-[#1C355E] italic">Inflection.</span></h2>
                                    <p className="text-2xl leading-relaxed text-charcoal font-medium">The definitive 2026 study on Australian coffee rituals across 750 survey respondents.</p>
                                    <div className="bg-white p-12 border-l-[16px] border-[#1C355E] shadow-2xl text-4xl font-black italic">"We are moving from a growth by volume market to a growth by indulgence market."</div>
                                    <button onClick={() => setActiveTab('audiences')} className="bg-[#1C355E] text-white px-10 py-5 font-black uppercase tracking-widest flex items-center gap-4 hover:bg-black transition-all">View Audiences <ArrowRight size={20}/></button>
                                </div>
                            )}

                            {activeTab === 'audiences' && (
                                <div className="space-y-12 animate-in fade-in">
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-10">
                                        <Card title="Audience Breakdown" className="lg:col-span-2">
                                            <div className="chart-container">
                                                <ResponsiveContainer>
                                                    <BarChart data={segmentData} layout="vertical" margin={{left: 40}}>
                                                        <XAxis type="number" hide/>
                                                        <YAxis dataKey="name" type="category" width={150} tick={{fontSize: 11, fontWeight: 900, fill: '#1C355E'}} axisLine={false} tickLine={false}/>
                                                        <Tooltip formatter={(v) => [`${v}%`, 'Market Share']}/>
                                                        <Bar dataKey="value" radius={[0, 4, 4, 0]} barSize={32}>
                                                            {segmentData.map((e, i) => <Cell key={i} fill={i === 0 ? '#1C355E' : '#2A2A2A'}/>)}
                                                        </Bar>
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </Card>
                                        <Card title="Primary Segment" className="border-4 border-[#1C355E] flex flex-col justify-center text-center p-10 bg-white">
                                            <Stat label="Market Engine" value="27%" sub="Specialty Enthusiasts" color="#1C355E"/>
                                        </Card>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                                        {segmentData.map((seg, i) => (
                                            <div key={i} className="p-6 bg-white border border-gray-100 rounded-sm">
                                                <div className="text-3xl font-black text-[#1C355E] mb-2">{seg.value}%</div>
                                                <h4 className="text-[10px] font-black uppercase border-b pb-2 mb-3">{seg.name}</h4>
                                                <p className="text-[11px] leading-tight font-bold opacity-70">{seg.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'pricing' && (
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-12 animate-in fade-in">
                                    <Card title="Generational Rituals" className="lg:col-span-2">
                                        <div className="chart-container">
                                            <ResponsiveContainer>
                                                <BarChart data={generationalShift}>
                                                    <XAxis dataKey="age" tick={{fontSize: 11, fontWeight: 900}}/>
                                                    <YAxis tick={{fontSize: 11}}/>
                                                    <Tooltip />
                                                    <Legend />
                                                    <Bar name="Hot" dataKey="hot" fill="#2A2A2A" />
                                                    <Bar name="Cold" dataKey="cold" fill="#1C355E" />
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </Card>
                                    <Card title="Strategic Benchmarks" className="bg-white border-4 border-[#1C355E] flex flex-col justify-center text-center p-12">
                                        <div className="space-y-12">
                                            <Stat label="Indifference" value="$5.90" color="#1C355E" />
                                            <div className="border-t pt-10">
                                                <Stat label="Optimal Price" value="$5.95" color="#2A2A2A" />
                                            </div>
                                        </div>
                                    </Card>
                                </div>
                            )}
                        </main>
                        <footer className="max-w-7xl mx-auto px-10 py-12 border-t mt-12 text-[10px] font-black uppercase tracking-widest opacity-40">
                            © 2026 Pablo and Rusty's Coffee Roasters
                        </footer>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        });
    </script>
</body>
</html>
