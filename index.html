<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Cafe and Coffee Insights Report | Pablo & Rusty's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #FDF9F3; margin: 0; color: #2A2A2A; }
        .chart-container { height: 350px; width: 100%; margin: 20px 0; }
        .loader { padding: 40px; font-family: sans-serif; color: #666; }
    </style>
</head>
<body>
    <div id="root"><div class="loader">Loading…</div></div>

    <script>
    // Sequential loader — guarantees order regardless of CDN behaviour.
    (function () {
        const scripts = [
            'https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js',
            'https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js',
            'https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js',
            'https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js'
        ];

        function loadNext(i) {
            if (i >= scripts.length) return boot();
            const s = document.createElement('script');
            s.src = scripts[i];
            s.crossOrigin = 'anonymous';
            s.onload = function () { loadNext(i + 1); };
            s.onerror = function () {
                document.getElementById('root').innerHTML =
                    '<div class="loader">Failed to load: ' + scripts[i] + '</div>';
            };
            document.head.appendChild(s);
        }

        function boot() {
            const missing = [];
            if (!window.React) missing.push('React');
            if (!window.ReactDOM) missing.push('ReactDOM');
            if (!window.PropTypes) missing.push('PropTypes');
            if (!window.Recharts) missing.push('Recharts');
            if (missing.length) {
                document.getElementById('root').innerHTML =
                    '<div class="loader">Missing globals: ' + missing.join(', ') + '</div>';
                return;
            }

            const React = window.React;
            const ReactDOM = window.ReactDOM;
            const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell, AreaChart, Area } = window.Recharts;

            const App = () => {
                const [tab, setTab] = React.useState('intro');

                const segments = [
                    { name: 'Specialty Enthusiasts', value: 27 },
                    { name: 'Casual Drinkers', value: 24 },
                    { name: 'Engaged Mainstream', value: 20 },
                    { name: 'Non Category', value: 16 },
                    { name: 'Convenience Regulars', value: 14 }
                ];

                const pricing = [
                    { p: 4.0, v: 90 }, { p: 5.0, v: 50 }, { p: 6.0, v: 10 }
                ];

                const Nav = () => React.createElement('nav', { className: 'flex overflow-x-auto border-b bg-white sticky top-0 z-50 px-6' },
                    ['intro', 'audiences', 'pricing', 'summary'].map(t =>
                        React.createElement('button', {
                            key: t,
                            onClick: () => setTab(t),
                            className: 'px-6 py-4 text-[10px] font-black uppercase tracking-widest border-b-2 transition-all ' +
                                (tab === t ? 'border-[#1C355E] text-[#1C355E]' : 'border-transparent text-gray-400')
                        }, t)
                    )
                );

                const Header = () => React.createElement('header', { className: 'bg-white px-10 py-8 flex justify-between items-center border-b' },
                    React.createElement('div', { className: 'flex items-center gap-4' },
                        React.createElement('div', { className: 'w-10 h-10 bg-[#1C355E] flex items-center justify-center text-white rounded font-black' }, 'PR'),
                        React.createElement('h1', { className: 'text-2xl font-black uppercase italic' }, "Pablo & Rusty's")
                    ),
                    React.createElement('div', { className: 'text-[10px] font-black uppercase opacity-40' }, '2026 Insights Report')
                );

                const Intro = () => React.createElement('div', { className: 'max-w-4xl space-y-8 py-10' },
                    React.createElement('h2', { className: 'text-7xl font-black uppercase tracking-tighter leading-none' },
                        'The Structural ', React.createElement('span', { className: 'text-[#1C355E] italic' }, 'Inflection.')
                    ),
                    React.createElement('p', { className: 'text-xl leading-relaxed' }, 'A definitive 2026 study on Australian coffee landscape shifting from volume to indulgence.'),
                    React.createElement('div', { className: 'bg-white p-10 border-l-[16px] border-[#1C355E] shadow-xl text-3xl font-black italic' },
                        '"Consumers are trading frequency for intensity."'
                    )
                );

                const Audiences = () => React.createElement('div', { className: 'space-y-10 py-10' },
                    React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-8' },
                        React.createElement('div', { className: 'lg:col-span-2 bg-white p-8 border' },
                            React.createElement('h3', { className: 'font-black uppercase text-sm mb-6' }, 'Audience Breakdown'),
                            React.createElement('div', { className: 'chart-container' },
                                React.createElement(ResponsiveContainer, null,
                                    React.createElement(BarChart, { data: segments, layout: 'vertical', margin: { left: 40 } },
                                        React.createElement(XAxis, { type: 'number', hide: true }),
                                        React.createElement(YAxis, { dataKey: 'name', type: 'category', width: 150, tick: { fontSize: 11, fontWeight: 900 } }),
                                        React.createElement(Tooltip, null),
                                        React.createElement(Bar, { dataKey: 'value', radius: [0, 4, 4, 0] },
                                            segments.map((e, i) => React.createElement(Cell, { key: i, fill: i === 0 ? '#1C355E' : '#2A2A2A' }))
                                        )
                                    )
                                )
                            )
                        ),
                        React.createElement('div', { className: 'bg-white border-4 border-[#1C355E] p-10 flex flex-col justify-center text-center' },
                            React.createElement('span', { className: 'text-[10px] font-black uppercase opacity-40' }, 'Growth Engine'),
                            React.createElement('span', { className: 'text-7xl font-black text-[#1C355E]' }, '27%'),
                            React.createElement('span', { className: 'text-xs font-black uppercase mt-4' }, 'Specialty Enthusiasts')
                        )
                    )
                );

                const Pricing = () => React.createElement('div', { className: 'py-10 grid grid-cols-1 lg:grid-cols-2 gap-8' },
                    React.createElement('div', { className: 'bg-white p-8 border' },
                        React.createElement('h3', { className: 'font-black uppercase text-sm mb-6' }, 'Price Sensitivity Meter'),
                        React.createElement('div', { className: 'chart-container' },
                            React.createElement(ResponsiveContainer, null,
                                React.createElement(AreaChart, { data: pricing },
                                    React.createElement(XAxis, { dataKey: 'p' }),
                                    React.createElement(Tooltip, null),
                                    React.createElement(Area, { type: 'monotone', dataKey: 'v', stroke: '#1C355E', fill: '#1C355E', fillOpacity: 0.3 })
                                )
                            )
                        )
                    ),
                    React.createElement('div', { className: 'bg-white border p-10 space-y-10 flex flex-col justify-center' },
                        React.createElement('div', null,
                            React.createElement('div', { className: 'text-[10px] font-black uppercase opacity-40' }, 'Indifference Point'),
                            React.createElement('div', { className: 'text-5xl font-black text-[#1C355E]' }, '$5.90')
                        ),
                        React.createElement('div', { className: 'border-t pt-10' },
                            React.createElement('div', { className: 'text-[10px] font-black uppercase opacity-40' }, 'Optimal Price Point'),
                            React.createElement('div', { className: 'text-7xl font-black text-[#2A2A2A]' }, '$5.95')
                        )
                    )
                );

                const Summary = () => React.createElement('div', { className: 'py-20 bg-[#1C355E] text-white p-10 rounded shadow-2xl mt-10' },
                    React.createElement('h2', { className: 'text-6xl font-black italic uppercase' }, 'Strategic Verdict.'),
                    React.createElement('p', { className: 'text-2xl mt-6 font-bold leading-relaxed' },
                        'The home ritual is now structural. Anchor local prices to global $8.50 benchmarks.'
                    )
                );

                return React.createElement('div', { className: 'min-h-screen pb-20' },
                    React.createElement(Header),
                    React.createElement(Nav),
                    React.createElement('main', { className: 'max-w-7xl mx-auto px-10' },
                        tab === 'intro' && React.createElement(Intro),
                        tab === 'audiences' && React.createElement(Audiences),
                        tab === 'pricing' && React.createElement(Pricing),
                        tab === 'summary' && React.createElement(Summary)
                    ),
                    React.createElement('footer', { className: 'max-w-7xl mx-auto px-10 py-10 border-t text-[10px] font-black uppercase tracking-widest opacity-30 mt-20' },
                        '\u00A9 2026 Pablo and Rusty\u2019s Coffee Roasters'
                    )
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(React.createElement(App));
        }

        loadNext(0);
    })();
    </script>
</body>
</html>
