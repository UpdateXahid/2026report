<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Cafe and Coffee Insights Report | Pablo & Rusty's</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #FDF9F3; color: #2A2A2A; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .chart-container { height: 300px; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Destructure Recharts from the global window object
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
            PieChart, Pie, Cell, AreaChart, Area, Radar, RadarChart, PolarGrid, 
            PolarAngleAxis, Legend, ScatterChart, Scatter, ZAxis 
        } = window.Recharts;

        const { 
            TrendingUp, Home, Coffee, Users, Search, DollarSign, MapPin, 
            Smartphone, ShoppingBag, Info, ArrowRight, ShieldCheck, Zap, Star, UserCheck, BarChart3 
        } = lucide;

        const PR_COLORS = {
            charcoal: '#2A2A2A', 
            deepCharcoal: '#1A1A1A',
            cream: '#FDF9F3', 
            gold: '#C5A059',
            rust: '#B94723', 
            blue: '#1C355E'
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('intro');

            // --- DATA ---
            const segmentData = [
                { name: 'Specialty Enthusiasts', value: 27, desc: 'Quality obsessed: The core growth engine.' },
                { name: 'Casual Drinkers', value: 24, desc: 'Socially motivated.' },
                { name: 'Engaged Mainstream', value: 20, desc: 'Balanced flavour/price.' },
                { name: 'Non Category', value: 16, desc: 'Low engagement.' },
                { name: 'Convenience Regulars', value: 14, desc: 'Routine driven: Pods/RTD.' }
            ];

            const generationalShift = [
                { age: '18-24', hot: 38, cold: 62 },
                { age: '25-34', hot: 52, cold: 48 },
                { age: '35-44', hot: 65, cold: 35 },
                { age: '45-54', hot: 78, cold: 22 },
                { age: '55+', hot: 89, cold: 11 }
            ];

            const priceSensitivity = [
                { price: 4.0, bargain: 90, expensive: 5 },
                { price: 5.0, bargain: 50, expensive: 40 },
                { price: 6.0, bargain: 10, expensive: 85 }
            ];

            const drinkTrends = [
                { name: 'Biscoff Latte', interest: 84 },
                { name: 'Tiramisu Latte', interest: 78 },
                { name: 'Pistachio Latte', interest: 65 },
                { name: 'Espresso Tonic', interest: 42 }
            ];

            // --- UI ---
            const Card = ({ title, subtitle, children, className = "" }) => (
                <div className={`bg-white p-8 border border-gray-200 rounded-sm shadow-sm ${className}`}>
                    <h3 className="text-sm font-black uppercase tracking-widest text-[#2A2A2A] mb-1">{title}</h3>
                    {subtitle && <p className="text-[10px] uppercase text-gray-400 font-bold mb-4 italic">{subtitle}</p>}
                    {children}
                </div>
            );

            const Stat = ({ label, value, sub, color = '#2A2A2A' }) => (
                <div className="flex flex-col">
                    <span className="text-[10px] uppercase font-black tracking-widest opacity-60">{label}</span>
                    <span className="text-6xl font-black tracking-tighter" style={{ color: color }}>{value}</span>
                    {sub && <span className="text-[12px] mt-1 uppercase font-black">{sub}</span>}
                </div>
            );

            return (
                <div className="min-h-screen">
                    {/* Nav */}
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-10 py-6 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-[#1C355E] flex items-center justify-center rounded-sm text-white"><Coffee size={24}/></div>
                                <h1 className="text-2xl font-black uppercase italic leading-none">Pablo & Rusty's</h1>
                            </div>
                            <nav className="flex overflow-x-auto no-scrollbar gap-4">
                                {['intro', 'audiences', 'summary', 'deep', 'pricing', 'rituals', 'final'].map(tab => (
                                    <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 text-[10px] font-black uppercase tracking-widest border-b-2 ${activeTab === tab ? 'border-[#1C355E] text-[#1C355E]' : 'border-transparent text-gray-400'}`}>
                                        {tab}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-10 py-12">
                        {activeTab === 'intro' && (
                            <div className="max-w-4xl space-y-8 animate-in fade-in">
                                <h2 className="text-7xl font-black uppercase tracking-tighter leading-none">The Structural <br/> <span className="text-[#1C355E] italic">Inflection.</span></h2>
                                <p className="text-xl leading-relaxed">Analysing the Australian coffee landscape 2025 to 2026. A definitive study on shifting rituals and price tolerance.</p>
                                <div className="bg-white p-12 border-l-[16px] border-[#1C355E] shadow-xl text-3xl font-black italic">"We are moving from a growth by volume market to a growth by indulgence market."</div>
                                <button onClick={() => setActiveTab('audiences')} className="bg-[#1C355E] text-white px-10 py-5 font-black uppercase tracking-widest flex items-center gap-4">Begin Analysis <ArrowRight size={20}/></button>
                            </div>
                        )}

                        {activeTab === 'audiences' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-10">
                                <Card title="Audience Breakdown" subtitle="N:750 Participants" className="lg:col-span-2">
                                    <div className="chart-container">
                                        <ResponsiveContainer>
                                            <BarChart data={segmentData} layout="vertical" margin={{left: 40}}>
                                                <XAxis type="number" hide/>
                                                <YAxis dataKey="name" type="category" width={150} tick={{fontSize: 11, fontWeight: 900, fill: '#1C355E'}} axisLine={false} tickLine={false}/>
                                                <Tooltip formatter={(v) => `${v}%`}/>
                                                <Bar dataKey="value" radius={[0, 4, 4, 0]}>
                                                    {segmentData.map((e, i) => <Cell key={i} fill={i === 0 ? '#1C355E' : '#2A2A2A'}/>)}
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </Card>
                                <Card title="Primary Target" className="border-4 border-[#1C355E] flex flex-col justify-center text-center">
                                    <Stat label="Growth Engine" value="27%" sub="Specialty Enthusiasts" color="#1C355E"/>
                                </Card>
                            </div>
                        )}

                        {activeTab === 'pricing' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-10">
                                <Card title="Price Sensitivity" className="lg:col-span-2">
                                    <div className="chart-container">
                                        <ResponsiveContainer>
                                            <AreaChart data={priceSensitivity}>
                                                <XAxis dataKey="price"/>
                                                <Tooltip formatter={(v)=>`${v}%`}/>
                                                <Area dataKey="bargain" fill="#1C355E" fillOpacity={0.4} stroke="#1C355E" strokeWidth={4}/>
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                </Card>
                                <Card title="Strategic Benchmarks" className="bg-white border-4 border-[#1C355E] flex flex-col justify-center p-10 shadow-2xl">
                                    <div className="space-y-12 text-center">
                                        <Stat label="Indifference" value="$5.90" color="#1C355E" />
                                        <div className="border-t pt-10">
                                            <Stat label="Optimal Price" value="$5.95" color="#1A1A1A" />
                                        </div>
                                    </div>
                                </Card>
                            </div>
                        )}

                        {activeTab === 'rituals' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                                <Card title="Flavour Interest">
                                    <div className="space-y-6">
                                        {drinkTrends.map((t,i) => (
                                            <div key={i} className="flex justify-between border-b pb-4">
                                                <span className="text-[11px] font-black uppercase">{t.name}</span>
                                                <span className="font-black text-[#1C355E]">{t.interest}%</span>
                                            </div>
                                        ))}
                                    </div>
                                </Card>
                                <Card title="Generational Ritual" className="md:col-span-2">
                                    <div className="chart-container">
                                        <ResponsiveContainer>
                                            <BarChart data={generationalShift}>
                                                <XAxis dataKey="age" tick={{fontSize: 10, fontWeight: 900}}/>
                                                <Legend/>
                                                <Bar name="Hot" dataKey="hot" fill="#2A2A2A"/>
                                                <Bar name="Cold" dataKey="cold" fill="#1C355E"/>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </Card>
                            </div>
                        )}

                        {activeTab === 'final' && (
                            <div className="bg-[#1C355E] text-white p-16 rounded-sm shadow-2xl space-y-10">
                                <h2 className="text-6xl font-black uppercase italic">Strategic Verdict.</h2>
                                <div className="border-l-8 border-[#C5A059] pl-8">
                                    <p className="text-2xl font-black leading-relaxed">The at-home shift is structural. Focus on capturing the home investment surge through premium whole bean and pod categories.</p>
                                </div>
                                <div className="pt-10 flex gap-10 opacity-40 font-black text-[10px] tracking-widest">
                                    <div>B:CORP</div><div>CLIMATE ACTIVE</div><div>1% FOR THE PLANET</div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="max-w-7xl mx-auto px-10 py-12 border-t mt-12 text-[10px] uppercase font-black tracking-widest opacity-40">
                        © 2026 Pablo and Rusty's Coffee Roasters : Data by Pollfish Australia
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
