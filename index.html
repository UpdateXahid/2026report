<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Cafe and Coffee Insights Report | Pablo & Rusty's</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #FDF9F3; color: #2A2A2A; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .chart-container { height: 350px; width: 100%; margin-top: 24px; }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex items-center justify-center h-screen bg-[#FDF9F3]">
            <div class="text-center">
                <div class="w-16 h-16 border-4 border-[#1C355E] border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
                <p class="text-[12px] font-black uppercase tracking-[0.3em] text-[#1C355E]">Loading 2026 Survey Insights...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        // POLLING INITIALISER: Wait for CDNs to attach to window
        const checkLibraries = () => {
            if (window.React && window.Recharts && window.lucide) {
                renderApp();
            } else {
                setTimeout(checkLibraries, 50);
            }
        };

        const renderApp = () => {
            const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, AreaChart, Area, Radar, RadarChart, PolarGrid, PolarAngleAxis, Legend, ScatterChart, Scatter, ZAxis } = window.Recharts;
            const { TrendingUp, Coffee, Info, ArrowRight, ShieldCheck, Zap, Star, UserCheck, BarChart3, DollarSign, Search, MapPin } = window.lucide;

            const PR_COLORS = { charcoal: '#2A2A2A', cream: '#FDF9F3', gold: '#C5A059', rust: '#B94723', blue: '#1C355E' };

            const App = () => {
                const [activeTab, setActiveTab] = React.useState('intro');

                const segmentData = [
                    { name: 'Specialty Enthusiasts', value: 27, desc: 'Quality obsessed: The core growth engine for cafes and beans.' },
                    { name: 'Casual Drinkers', value: 24, desc: 'Socially motivated: View the cafe as a third space.' },
                    { name: 'Engaged Mainstream', value: 20, desc: 'Balanced regulars: Flavour focused but price sensitive.' },
                    { name: 'Non Category', value: 16, desc: 'Low engagement or infrequent coffee participants.' },
                    { name: 'Convenience Regulars', value: 14, desc: 'Routine driven: Favour pods and speed of service.' }
                ];

                const generationalShift = [
                    { age: '18-24', hot: 38, cold: 62 },
                    { age: '25-34', hot: 52, cold: 48 },
                    { age: '35-44', hot: 65, cold: 35 },
                    { age: '45-54', hot: 78, cold: 22 },
                    { age: '55+', hot: 89, cold: 11 }
                ];

                const drinkTrends = [
                    { name: 'Biscoff Latte', interest: 84 },
                    { name: 'Tiramisu Latte', interest: 78 },
                    { name: 'Pistachio Latte', interest: 65 },
                    { name: 'Espresso Tonic', interest: 42 }
                ];

                const Card = ({ title, subtitle, children, className = "" }) => (
                    <div className={`bg-white p-8 border border-gray-200 rounded-sm shadow-sm ${className}`}>
                        <h3 className="text-sm font-black uppercase tracking-widest text-[#2A2A2A] mb-1">{title}</h3>
                        {subtitle && <p className="text-[10px] uppercase text-gray-400 font-bold mb-6 tracking-wider italic">{subtitle}</p>}
                        {children}
                    </div>
                );

                const Stat = ({ label, value, sub, color = '#2A2A2A' }) => (
                    <div className="flex flex-col">
                        <span className="text-[10px] uppercase font-black tracking-widest opacity-60 mb-2">{label}</span>
                        <span className="text-7xl font-black tracking-tighter leading-none" style={{ color: color }}>{value}</span>
                        {sub && <span className="text-[12px] mt-4 uppercase font-black text-[#2A2A2A]">{sub}</span>}
                    </div>
                );

                return (
                    <div className="min-h-screen">
                        <header className="bg-white border-b border-gray-200 sticky top-0 z-50">
                            <div className="max-w-7xl mx-auto px-10 py-8 flex justify-between items-center">
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-[#1C355E] flex items-center justify-center rounded-sm text-white"><Coffee size={24}/></div>
                                    <h1 className="text-3xl font-black uppercase italic leading-none tracking-tighter">Pablo & Rusty's</h1>
                                </div>
                                <nav className="flex overflow-x-auto no-scrollbar gap-4">
                                    {['intro', 'audiences', 'deep', 'pricing', 'rituals', 'final'].map(tab => (
                                        <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 text-[10px] font-black uppercase tracking-widest border-b-4 transition-all ${activeTab === tab ? 'border-[#1C355E] text-[#1C355E]' : 'border-transparent text-gray-400'}`}>
                                            {tab}
                                        </button>
                                    ))}
                                </nav>
                            </div>
                        </header>

                        <main className="max-w-7xl mx-auto px-10 py-16">
                            {activeTab === 'intro' && (
                                <div className="max-w-4xl space-y-12 animate-in fade-in slide-in-from-bottom-4 duration-700">
                                    <h2 className="text-8xl font-black uppercase tracking-tighter leading-none text-charcoal">The Structural <br/> <span className="text-[#1C355E] italic underline decoration-8 underline-offset-8">Inflection.</span></h2>
                                    <p className="text-2xl leading-relaxed text-charcoal font-medium">Analysing the Australian coffee landscape 2025 to 2026. A definitive study on shifting rituals and price tolerance across 750 respondents.</p>
                                    <div className="bg-white p-16 border-l-[20px] border-[#1C355E] shadow-2xl text-4xl font-black italic text-charcoal leading-tight">"We are moving from a growth by volume market to a growth by indulgence market."</div>
                                    <button onClick={() => setActiveTab('audiences')} className="bg-[#1C355E] text-white px-12 py-6 text-base font-black uppercase tracking-widest flex items-center gap-4 hover:bg-black transition-all shadow-xl">Begin Analysis <ArrowRight size={24}/></button>
                                </div>
                            )}

                            {activeTab === 'audiences' && (
                                <div className="space-y-16 animate-in fade-in duration-500">
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-12">
                                        <Card title="Audience Breakdown" subtitle="Weighted Sample N:750" className="lg:col-span-2">
                                            <div className="chart-container">
                                                <ResponsiveContainer>
                                                    <BarChart data={segmentData} layout="vertical" margin={{left: 60}}>
                                                        <XAxis type="number" hide/>
                                                        <YAxis dataKey="name" type="category" width={180} tick={{fontSize: 12, fontWeight: 900, fill: '#1C355E'}} axisLine={false} tickLine={false}/>
                                                        <Tooltip formatter={(v) => [`${v}%`, 'Market Share']}/>
                                                        <Bar dataKey="value" radius={[0, 4, 4, 0]} barSize={40}>
                                                            {segmentData.map((e, i) => <Cell key={i} fill={i === 0 ? '#1C355E' : '#2A2A2A'}/>)}
                                                        </Bar>
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </Card>
                                        <Card title="Primary Growth Target" className="border-4 border-[#1C355E] flex flex-col justify-center text-center bg-white shadow-2xl p-10">
                                            <Stat label="Market Engine" value="27%" sub="Specialty Enthusiasts" color="#1C355E"/>
                                        </Card>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-5 gap-6">
                                        {segmentData.map((seg, i) => (
                                            <div key={i} className="p-8 bg-white border border-gray-100 rounded-sm hover:border-[#1C355E] transition-all">
                                                <div className="text-4xl font-black text-[#1C355E] mb-2">{seg.value}%</div>
                                                <h4 className="text-[11px] font-black uppercase mb-4 border-b pb-2 tracking-widest">{seg.name}</h4>
                                                <p className="text-[12px] leading-relaxed font-bold opacity-70">{seg.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'deep' && (
                                <div className="space-y-12 animate-in fade-in duration-500">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                        <Card title="The Generational Pivot" subtitle="Hot vs Cold drink preference (Wave comparison)">
                                            <div className="chart-container">
                                                <ResponsiveContainer>
                                                    <BarChart data={generationalShift}>
                                                        <XAxis dataKey="age" tick={{fontSize: 11, fontWeight: 900}}/>
                                                        <YAxis tick={{fontSize: 11}} />
                                                        <Tooltip formatter={(v)=>`${v}%`}/>
                                                        <Legend verticalAlign="top" height={36}/>
                                                        <Bar name="Hot Selection" dataKey="hot" fill="#2A2A2A" radius={[4, 4, 0, 0]}/>
                                                        <Bar name="Cold Selection" dataKey="cold" fill="#1C355E" radius={[4, 4, 0, 0]}/>
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                            <p className="mt-8 text-xs font-bold text-charcoal italic">Insight: 62% of Gen Z participants now prefer iced formats over traditional hot beverages.</p>
                                        </Card>
                                        <div className="bg-[#1C355E] text-white p-12 flex flex-col justify-center rounded-sm space-y-8 shadow-2xl">
                                            <Zap className="text-[#C5A059]" size={48}/>
                                            <h4 className="text-xl font-black uppercase italic tracking-widest underline decoration-[#C5A059]">Equipment Parity Report</h4>
                                            <p className="text-2xl font-black leading-tight italic">For the first time in survey history, home espresso machine usage (44%) has reached parity with weekly cafe visitation frequency.</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'pricing' && (
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-12 animate-in fade-in duration-500">
                                    <Card title="Price Sensitivity Meter" subtitle="Threshold analysis for Flat White" className="lg:col-span-2">
                                        <div className="chart-container">
                                            <ResponsiveContainer>
                                                <AreaChart data={[{p:4, b:90, e:5}, {p:5, b:50, e:40}, {p:6, b:10, e:85}]} margin={{left: 0, right: 0}}>
                                                    <XAxis dataKey="p" label={{value: 'Price Point ($)', position: 'insideBottom', offset: -5}}/>
                                                    <YAxis hide />
                                                    <Tooltip />
                                                    <Area name="Bargain Perception" dataKey="b" fill="#1C355E" fillOpacity={0.4} stroke="#1C355E" strokeWidth={5}/>
                                                    <Area name="Expensive Perception" dataKey="e" fill="#B94723" fillOpacity={0.1} stroke="#B94723" strokeWidth={2}/>
                                                </AreaChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </Card>
                                    <Card title="Strategic Benchmarks" className="bg-white border-4 border-[#1C355E] flex flex-col justify-center p-12 shadow-2xl space-y-16 text-center">
                                        <div>
                                            <span className="text-[11px] uppercase font-black opacity-60">Indifference Point</span>
                                            <div className="text-6xl font-black text-[#1C355E] tracking-tighter leading-none mt-2">$5.90</div>
                                        </div>
                                        <div className="border-t border-gray-100 pt-16">
                                            <span className="text-[11px] uppercase font-black opacity-60">Optimal Price Point</span>
                                            <div className="text-8xl font-black text-[#2A2A2A] tracking-tighter leading-none mt-2">$5.95</div>
                                            <span className="text-[10px] font-black uppercase text-[#B94723] mt-6 block">Maximum Conversion Threshold</span>
                                        </div>
                                    </Card>
                                </div>
                            )}

                            {activeTab === 'rituals' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-10 animate-in fade-in duration-500">
                                    <Card title="Flavour Innovation Index" subtitle="LTO Engagement levels">
                                        <div className="space-y-10 py-6">
                                            {drinkTrends.map((t,i) => (
                                                <div key={i} className="flex justify-between items-center border-b border-gray-100 pb-6">
                                                    <span className="text-sm font-black uppercase text-charcoal tracking-widest">{t.name}</span>
                                                    <span className="text-2xl font-black text-[#1C355E]">{t.interest}%</span>
                                                </div>
                                            ))}
                                        </div>
                                    </Card>
                                    <div className="bg-white border-2 border-dashed border-gray-300 p-12 flex flex-col justify-center text-center rounded-sm">
                                        <h4 className="text-[11px] font-black uppercase opacity-40 mb-10 tracking-[0.4em]">Survey Data Summary</h4>
                                        <div className="grid grid-cols-2 gap-10">
                                            <div><div className="text-7xl font-black text-[#1C355E]">46%</div><div className="text-[11px] font-black uppercase mt-4">Local Cafe Hub</div></div>
                                            <div><div className="text-7xl font-black text-charcoal">44%</div><div className="text-[11px] font-black uppercase mt-4">Home Specialty</div></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'final' && (
                                <div className="bg-[#1C355E] text-white p-24 rounded-sm shadow-2xl space-y-20 animate-in zoom-in-95 duration-1000">
                                    <h2 className="text-9xl font-black uppercase italic tracking-tighter leading-none">Strategic <br/>Verdict.</h2>
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-20">
                                        <div className="border-l-8 border-[#C5A059] pl-12 space-y-6">
                                            <h4 className="text-[#C5A059] font-black uppercase text-sm tracking-widest">Growth Directive</h4>
                                            <p className="text-4xl font-black leading-tight">The home ritual is now structural. Focus resources on premium whole bean retail and high:performance specialty pods.</p>
                                        </div>
                                        <div className="border-l-8 border-[#C5A059] pl-12 space-y-6">
                                            <h4 className="text-[#C5A059] font-black uppercase text-sm tracking-widest">Pricing Anchor</h4>
                                            <p className="text-4xl font-black leading-tight">Anchor local cafe prices to global $8.50 benchmarks to normalise local costs and protect profitability.</p>
                                        </div>
                                    </div>
                                    <div className="pt-24 flex justify-center gap-20 opacity-30 grayscale font-black text-[12px] tracking-[0.5em]">
                                        <div>B:CORP</div><div>CLIMATE ACTIVE</div><div>1% FOR THE PLANET</div>
                                    </div>
                                </div>
                            )}
                        </main>

                        <footer className="max-w-7xl mx-auto px-10 py-24 border-t border-gray-200 mt-20 text-center opacity-40">
                            <p className="text-[11px] font-black uppercase tracking-[0.6em]">© 2026 Pablo and Rusty's Coffee Roasters : Data Powered by Pollfish Australia</p>
                        </footer>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        };

        checkLibraries();
    </script>
</body>
</html>
