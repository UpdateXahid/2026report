<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Cafe and Coffee Insights Report | Pablo & Rusty's</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #FDF9F3; color: #2A2A2A; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .chart-container { height: 350px; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
            PieChart, Pie, Cell, AreaChart, Area, Radar, RadarChart, PolarGrid, 
            PolarAngleAxis, Legend, ScatterChart, Scatter, ZAxis 
        } = window.Recharts;

        const { 
            TrendingUp, Home, Coffee, Users, Search, DollarSign, MapPin, 
            Smartphone, ShoppingBag, Info, ArrowRight, ShieldCheck, Zap, Star, UserCheck, BarChart3 
        } = lucide;

        const PR_COLORS = {
            charcoal: '#2A2A2A', 
            deepCharcoal: '#1A1A1A',
            cream: '#FDF9F3', 
            gold: '#C5A059',
            rust: '#B94723', 
            blue: '#1C355E'
        };

        const App = () => {
            // Must use React.useState for standalone Babel
            const [activeTab, setActiveTab] = React.useState('intro');

            // --- DATASETS ---
            const segmentData = [
                { name: 'Specialty Enthusiasts', value: 27, desc: 'Quality obsessed: The core growth engine.' },
                { name: 'Casual Drinkers', value: 24, desc: 'Socially motivated.' },
                { name: 'Engaged Mainstream', value: 20, desc: 'Balanced flavour and price.' },
                { name: 'Non Category', value: 16, desc: 'Low engagement.' },
                { name: 'Convenience Regulars', value: 14, desc: 'Routine driven: Pods and RTD.' }
            ];

            const generationalShift = [
                { age: '18-24', hot: 38, cold: 62 },
                { age: '25-34', hot: 52, cold: 48 },
                { age: '35-44', hot: 65, cold: 35 },
                { age: '45-54', hot: 78, cold: 22 },
                { age: '55+', hot: 89, cold: 11 }
            ];

            const suburbanMigration = [
                { location: 'Near Home', wave2025: 64, wave2026: 46 },
                { location: 'Workplace', wave2025: 43, wave2026: 33 },
                { location: 'CBD Centre', wave2025: 28, wave2026: 18 }
            ];

            const priceSensitivity = [
                { price: 4.0, bargain: 90, expensive: 5 },
                { price: 5.0, bargain: 50, expensive: 40 },
                { price: 6.0, bargain: 10, expensive: 85 }
            ];

            const drinkTrends = [
                { name: 'Biscoff Latte', interest: 84 },
                { name: 'Tiramisu Latte', interest: 78 },
                { name: 'Pistachio Latte', interest: 65 },
                { name: 'Espresso Tonic', interest: 42 }
            ];

            const milkTolerance = [
                { segment: 'Specialty', pay: 85 },
                { segment: 'Mainstream', pay: 72 },
                { segment: 'Casual', pay: 60 },
                { segment: 'Convenience', pay: 45 }
            ];

            // --- UI HELPERS ---
            const Card = ({ title, subtitle, children, className = "" }) => (
                <div className={`bg-white p-8 border border-gray-200 rounded-sm shadow-sm ${className}`}>
                    <h3 className="text-sm font-black uppercase tracking-widest text-[#2A2A2A] mb-1">{title}</h3>
                    {subtitle && <p className="text-[10px] uppercase text-gray-400 font-bold mb-4 italic">{subtitle}</p>}
                    {children}
                </div>
            );

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-8 py-6 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-[#1C355E] flex items-center justify-center rounded-sm text-white"><Coffee size={24}/></div>
                                <h1 className="text-2xl font-black uppercase italic leading-none">Pablo & Rusty's</h1>
                            </div>
                            <nav className="flex overflow-x-auto no-scrollbar gap-2">
                                {['intro', 'audiences', 'deep', 'pricing', 'rituals', 'final'].map(tab => (
                                    <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 text-[10px] font-black uppercase tracking-widest border-b-2 transition-all ${activeTab === tab ? 'border-[#1C355E] text-[#1C355E]' : 'border-transparent text-gray-400 hover:text-charcoal'}`}>
                                        {tab}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-8 py-12">
                        {activeTab === 'intro' && (
                            <div className="max-w-4xl space-y-8 animate-in fade-in">
                                <h2 className="text-7xl font-black uppercase tracking-tighter leading-none text-charcoal">The Structural <br/> <span className="text-[#1C355E] italic">Inflection.</span></h2>
                                <p className="text-xl leading-relaxed text-charcoal font-medium">Analysing the Australian coffee landscape 2025 to 2026. A definitive study on shifting rituals and price tolerance across 750 respondents.</p>
                                <div className="bg-white p-12 border-l-[16px] border-[#1C355E] shadow-xl text-3xl font-black italic text-charcoal">"We are moving from a growth by volume market to a growth by indulgence market."</div>
                                <button onClick={() => setActiveTab('audiences')} className="bg-[#1C355E] text-white px-10 py-5 font-black uppercase tracking-widest flex items-center gap-4 hover:bg-black transition-all">Begin Analysis <ArrowRight size={20}/></button>
                            </div>
                        )}

                        {activeTab === 'audiences' && (
                            <div className="space-y-10 animate-in fade-in">
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-10">
                                    <Card title="Audience Breakdown" subtitle="Participation Distribution" className="lg:col-span-2">
                                        <div className="chart-container">
                                            <ResponsiveContainer>
                                                <BarChart data={segmentData} layout="vertical" margin={{left: 40}}>
                                                    <XAxis type="number" hide/>
                                                    <YAxis dataKey="name" type="category" width={150} tick={{fontSize: 11, fontWeight: 900, fill: '#1C355E'}} axisLine={false} tickLine={false}/>
                                                    <Tooltip formatter={(v) => [`${v}%`, 'Market Share']}/>
                                                    <Bar dataKey="value" radius={[0, 4, 4, 0]}>
                                                        {segmentData.map((e, i) => <Cell key={i} fill={i === 0 ? '#1C355E' : '#2A2A2A'}/>)}
                                                    </Bar>
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </Card>
                                    <Card title="Primary Target" className="border-4 border-[#1C355E] flex flex-col justify-center text-center bg-white shadow-2xl">
                                        <span className="text-[10px] uppercase font-black opacity-60">Growth Engine</span>
                                        <span className="text-8xl font-black tracking-tighter text-[#1C355E]">27%</span>
                                        <span className="text-xs font-black uppercase mt-4">Specialty Enthusiasts</span>
                                    </Card>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                                    {segmentData.map((seg, i) => (
                                        <div key={i} className="p-6 bg-white border border-gray-100 rounded-sm">
                                            <div className="text-3xl font-black text-[#1C355E] mb-1">{seg.value}%</div>
                                            <h4 className="text-[10px] font-black uppercase mb-3 border-b pb-2">{seg.name}</h4>
                                            <p className="text-[11px] leading-tight font-bold text-charcoal opacity-80">{seg.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'deep' && (
                            <div className="space-y-12 animate-in fade-in">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <Card title="The Generational Pivot" subtitle="Hot vs Cold preference">
                                        <div className="chart-container">
                                            <ResponsiveContainer>
                                                <BarChart data={generationalShift}>
                                                    <XAxis dataKey="age" tick={{fontSize: 10, fontWeight: 900}}/>
                                                    <YAxis tick={{fontSize: 10}}/>
                                                    <Tooltip formatter={(v)=>`${v}%`}/>
                                                    <Legend />
                                                    <Bar name="Hot Preference" dataKey="hot" fill="#2A2A2A"/>
                                                    <Bar name="Cold Preference" dataKey="cold" fill="#1C355E"/>
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </Card>
                                    <Card title="Suburban Migration" subtitle="Purchase Location 2025 to 2026">
                                        <div className="chart-container">
                                            <ResponsiveContainer>
                                                <BarChart data={suburbanMigration}>
                                                    <XAxis dataKey="location" tick={{fontSize: 10, fontWeight: 900}}/>
                                                    <YAxis tick={{fontSize: 10}}/>
                                                    <Tooltip formatter={(v)=>`${v}%`}/>
                                                    <Legend />
                                                    <Bar name="2025 Wave" dataKey="wave2025" fill="#E5E5E5"/>
                                                    <Bar name="2026 Wave" dataKey="wave2026" fill="#1C355E"/>
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </Card>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <Card title="Alt Milk Tolerance" subtitle="% Willing to pay $0.50 premium">
                                        <div className="chart-container">
                                            <ResponsiveContainer>
                                                <BarChart data={milkTolerance} layout="vertical" margin={{left: 40}}>
                                                    <XAxis type="number" hide/>
                                                    <YAxis dataKey="segment" type="category" width={120} tick={{fontSize: 10, fontWeight: 900}} axisLine={false} tickLine={false}/>
                                                    <Tooltip formatter={(v)=>`${v}%`}/>
                                                    <Bar dataKey="pay" fill="#1C355E" radius={[0, 4, 4, 0]} barSize={24}/>
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </Card>
                                    <div className="bg-charcoal p-10 text-white rounded-sm flex flex-col justify-center space-y-6 shadow-2xl">
                                        <Star className="text-gold" size={40}/>
                                        <h4 className="text-sm font-black uppercase tracking-widest text-gold italic">Deep Analytics Summary</h4>
                                        <p className="text-2xl font-black leading-tight italic">Gen Z is the first generation to prefer cold coffee (62%), making "Cold Start" equipment a non:negotiable for future cafe fitouts.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'pricing' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-10 animate-in fade-in">
                                <Card title="Price Sensitivity Meter" subtitle="Perception Thresholds" className="lg:col-span-2">
                                    <div className="chart-container">
                                        <ResponsiveContainer>
                                            <AreaChart data={priceSensitivity}>
                                                <XAxis dataKey="price" tick={{fontWeight: 'bold'}}/>
                                                <YAxis hide/>
                                                <Tooltip formatter={(v)=>`${v}%`}/>
                                                <Area name="Bargain" dataKey="bargain" fill="#1C355E" fillOpacity={0.4} stroke="#1C355E" strokeWidth={4}/>
                                                <Area name="Expensive" dataKey="expensive" fill="#B94723" fillOpacity={0.1} stroke="#B94723"/>
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                </Card>
                                <Card title="Strategic Benchmarks" className="bg-white border-4 border-[#1C355E] flex flex-col justify-center p-10 shadow-2xl space-y-12 text-center">
                                    <div>
                                        <span className="text-[10px] uppercase font-black opacity-60">Indifference Point</span>
                                        <div className="text-6xl font-black text-[#1C355E] tracking-tighter">$5.90</div>
                                    </div>
                                    <div className="border-t pt-12">
                                        <span className="text-[10px] uppercase font-black opacity-60">Optimal Price Point</span>
                                        <div className="text-7xl font-black text-[#1A1A1A] tracking-tighter">$5.95</div>
                                        <span className="text-[10px] font-black uppercase text-[#B94723] mt-2 block">Highest Conversion Potential</span>
                                    </div>
                                </Card>
                            </div>
                        )}

                        {activeTab === 'rituals' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-10 animate-in fade-in">
                                <Card title="Discovery & Trends">
                                    <div className="space-y-8 py-4">
                                        {drinkTrends.map((t,i) => (
                                            <div key={i} className="flex justify-between items-center border-b pb-4">
                                                <span className="text-[11px] font-black uppercase text-charcoal">{t.name}</span>
                                                <span className="text-xl font-black text-[#1C355E]">{t.interest}%</span>
                                            </div>
                                        ))}
                                    </div>
                                </Card>
                                <Card title="Visual Ritual Summary" className="md:col-span-2 flex flex-col justify-center text-center p-16">
                                    <div className="grid grid-cols-2 gap-10">
                                        <div><div className="text-6xl font-black text-[#1C355E]">46%</div><div className="text-[10px] font-black uppercase mt-2">Cafe Near Home</div></div>
                                        <div><div className="text-6xl font-black text-charcoal">44%</div><div className="text-[10px] font-black uppercase mt-2">Home Espresso</div></div>
                                    </div>
                                    <p className="mt-12 text-lg font-bold italic border-t pt-8">Equipment usage has reached parity with cafe visitation for the first time in survey history.</p>
                                </Card>
                            </div>
                        )}

                        {activeTab === 'final' && (
                            <div className="bg-[#1C355E] text-white p-20 rounded-sm shadow-2xl space-y-16 animate-in zoom-in-95">
                                <h2 className="text-8xl font-black uppercase italic tracking-tighter leading-none">Strategic <br/>Verdict.</h2>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-16">
                                    <div className="border-l-8 border-[#C5A059] pl-10 space-y-4">
                                        <h4 className="text-[#C5A059] font-black uppercase text-xs tracking-widest">Growth Recommendation</h4>
                                        <p className="text-3xl font-black leading-tight">The at-home shift is structural. Pivot resources to premium whole bean categories and high:performance pods.</p>
                                    </div>
                                    <div className="border-l-8 border-[#C5A059] pl-10 space-y-4">
                                        <h4 className="text-[#C5A059] font-black uppercase text-xs tracking-widest">Pricing Directive</h4>
                                        <p className="text-3xl font-black leading-tight">Anchor local prices to global $8.50 benchmarks to normalise the $6.00 price floor.</p>
                                    </div>
                                </div>
                                <div className="pt-20 flex justify-center gap-12 opacity-30 grayscale font-black text-[10px] tracking-widest">
                                    <div>B:CORP CERTIFIED</div><div>CLIMATE ACTIVE</div><div>1% FOR THE PLANET</div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="max-w-7xl mx-auto px-8 py-16 border-t mt-12 text-center">
                        <p className="text-[10px] uppercase font-black tracking-[0.5em] text-gray-400">© 2026 Pablo and Rusty's Coffee Roasters : Data Powered by Pollfish Australia</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
