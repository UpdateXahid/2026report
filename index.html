<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Cafe and Coffee Insights Report | Pablo & Rusty's</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configure Tailwind to recognise custom brand colours used throughout the report.
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: '#2A2A2A',
                        cream: '#FDF9F3',
                        prblue: '#1C355E',
                        rust: '#B94723',
                        gold: '#C5A059'
                    }
                }
            }
        };
    </script>

    <!-- Order matters: React, then ReactDOM, then PropTypes (required by Recharts), then Recharts, then lucide-react, then Babel last. -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FDF9F3;
            color: #2A2A2A;
            margin: 0;
            overflow-x: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .chart-container { height: 350px; width: 100%; margin-top: 24px; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex items-center justify-center h-screen bg-cream">
            <div class="text-center">
                <div class="w-16 h-16 border-4 border-prblue border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
                <p class="text-[12px] font-black uppercase tracking-[0.4em] text-prblue">Compiling Full 2026 Dataset...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        // Poll until every required global is on window, then boot.
        // Caps at ~6 seconds then surfaces a real error instead of spinning forever.
        let attempts = 0;
        const MAX_ATTEMPTS = 60;

        const startApplication = () => {
            const LucideLib = window.lucideReact || window.LucideReact;
            const ready =
                window.React &&
                window.ReactDOM &&
                window.PropTypes &&
                window.Recharts &&
                LucideLib;

            if (!ready) {
                attempts += 1;
                if (attempts > MAX_ATTEMPTS) {
                    const missing = [];
                    if (!window.React) missing.push('React');
                    if (!window.ReactDOM) missing.push('ReactDOM');
                    if (!window.PropTypes) missing.push('PropTypes');
                    if (!window.Recharts) missing.push('Recharts');
                    if (!LucideLib) missing.push('lucide-react');
                    document.getElementById('root').innerHTML =
                        '<div style="padding:60px;font-family:sans-serif;">' +
                        '<h2 style="font-weight:900;text-transform:uppercase;color:#1C355E;">Failed to initialise</h2>' +
                        '<p>Missing globals: ' + missing.join(', ') + '</p>' +
                        '<p style="color:#666;">Check your network or CDN access.</p>' +
                        '</div>';
                    return;
                }
                setTimeout(startApplication, 100);
                return;
            }

            const {
                BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
                PieChart, Pie, Cell, AreaChart, Area, ComposedChart, Line, ScatterChart,
                Scatter, ZAxis, Radar, RadarChart, PolarGrid, PolarAngleAxis, Legend
            } = window.Recharts;

            // Defensive icon resolution: if a name is missing, fall back to a neutral circle so the page never crashes.
            const PlaceholderIcon = ({ size = 24, className = '', strokeWidth = 2 }) => (
                <svg width={size} height={size} className={className} viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" strokeWidth={strokeWidth}>
                    <circle cx="12" cy="12" r="10" />
                </svg>
            );
            const ic = (name) => (LucideLib && LucideLib[name]) || PlaceholderIcon;

            const TrendingUp  = ic('TrendingUp');
            const Home        = ic('Home');
            const Coffee      = ic('Coffee');
            const Users       = ic('Users');
            const Search      = ic('Search');
            const DollarSign  = ic('DollarSign');
            const MapPin      = ic('MapPin');
            const Smartphone  = ic('Smartphone');
            const ShoppingBag = ic('ShoppingBag');
            const Info        = ic('Info');
            const ArrowRight  = ic('ArrowRight');
            const ShieldCheck = ic('ShieldCheck');
            const Zap         = ic('Zap');
            const Star        = ic('Star');
            const UserCheck   = ic('UserCheck');
            const BarChart3   = ic('BarChart3');

            // Brand Standards
            const PR_COLORS = {
                charcoal: '#2A2A2A',
                deepCharcoal: '#1A1A1A',
                cream: '#FDF9F3',
                gold: '#C5A059',
                rust: '#B94723',
                blue: '#1C355E',
                gray: '#757575',
                lightGray: '#E5E5E5'
            };

            const App = () => {
                const [activeTab, setActiveTab] = React.useState('intro');

                // --- 1. CORE SEGMENT DATA ---
                const segmentData = [
                    { name: 'Specialty Enthusiasts', value: 27, desc: 'The category engine. Quality obsessed and showing the highest positive spending intent.' },
                    { name: 'Casual Drinkers', value: 24, desc: 'Socially motivated. View the cafe as a key third space for connection.' },
                    { name: 'Engaged Mainstream', value: 20, desc: 'Balanced regulars. Flavour focused but increasingly price sensitive in 2026.' },
                    { name: 'Non Category', value: 16, desc: 'Low engagement. Infrequent drinkers or participants who favour non-coffee beverages.' },
                    { name: 'Convenience Regulars', value: 14, desc: 'Routine driven. Favour pods, RTD, and speed of delivery over origin stories.' }
                ];

                // --- 2. MARKET PULSE DATA ---
                const scissorData = [
                    { name: 'Cafe Spend', direction: -13, fill: PR_COLORS.rust },
                    { name: 'Home Spend', direction: 28, fill: PR_COLORS.blue }
                ];

                // --- 3. DEEP ANALYTICS DATA (10 SETS) ---
                const generationalShift = [
                    { age: '18 to 24', hot: 38, cold: 62 },
                    { age: '25 to 34', hot: 52, cold: 48 },
                    { age: '35 to 44', hot: 65, cold: 35 },
                    { age: '45 to 54', hot: 78, cold: 22 },
                    { age: '55 plus', hot: 89, cold: 11 }
                ];

                const anchorEffect = [
                    { price: 4.0, before: 80, after: 95 },
                    { price: 5.0, before: 40, after: 75 },
                    { price: 6.0, before: 5, after: 45 },
                    { price: 7.0, before: 0, after: 15 }
                ];

                const suburbanMigration = [
                    { location: 'Near Home', wave2025: 64, wave2026: 46 },
                    { location: 'Workplace', wave2025: 43, wave2026: 33 },
                    { location: 'CBD Centre', wave2025: 28, wave2026: 18 }
                ];

                const equipmentRadar = [
                    { subject: 'Espresso', A: 90, B: 20 },
                    { subject: 'Pods', A: 15, B: 85 },
                    { subject: 'Filter', A: 45, B: 5 },
                    { subject: 'Manual', A: 60, B: 2 },
                    { subject: 'Instant', A: 5, B: 70 }
                ];

                const milkTolerance = [
                    { segment: 'Specialty', pay: 85 },
                    { segment: 'Mainstream', pay: 72 },
                    { segment: 'Casual', pay: 60 },
                    { segment: 'Convenience', pay: 45 }
                ];

                const indulgenceIndex = [
                    { age: '18 to 24', interest: 92 },
                    { age: '25 to 34', interest: 85 },
                    { age: '35 to 44', interest: 70 },
                    { age: '45 to 54', interest: 45 },
                    { age: '55 plus', interest: 20 }
                ];

                const pressureData = [
                    { status: 'Comfortable', trajectory: 15 },
                    { status: 'Manageable', trajectory: -8 },
                    { status: 'Under Pressure', trajectory: -24 },
                    { status: 'Signif. Pressure', trajectory: -42 }
                ];

                const brandConversion = [
                    { awareness: 85, trial: 55, name: 'Mainstream' },
                    { awareness: 45, trial: 30, name: 'Specialty' },
                    { awareness: 25, trial: 22, name: 'Artisan' },
                    { awareness: 10, trial: 8, name: 'Niche' }
                ];

                const subGrowth = [
                    { period: '2025 Wave', value: 16 },
                    { period: '2026 Wave', value: 24 }
                ];

                const driverMatrix = [
                    { x: 90, y: 30, name: 'Taste Priority' },
                    { x: 70, y: 65, name: 'Balanced' },
                    { x: 40, y: 95, name: 'Price Priority' }
                ];

                // --- 4. PRICING & RITUALS ---
                const priceSensitivity = [
                    { price: 4.0, bargain: 90, expensive: 5, quality: 60 },
                    { price: 4.5, bargain: 75, expensive: 15, quality: 40 },
                    { price: 5.0, bargain: 50, expensive: 40, quality: 15 },
                    { price: 5.5, bargain: 25, expensive: 65, quality: 5 },
                    { price: 6.0, bargain: 10, expensive: 85, quality: 2 }
                ];

                const drinkTrends = [
                    { name: 'Biscoff Latte', interest: 84 },
                    { name: 'Tiramisu Latte', interest: 78 },
                    { name: 'Pistachio Latte', interest: 65 },
                    { name: 'Espresso Tonic', interest: 42 }
                ];

                const discoveryData = [
                    { name: 'Word of Mouth', value: 42 },
                    { name: 'Facebook', value: 27 },
                    { name: 'Instagram', value: 24 },
                    { name: 'TikTok', value: 18 }
                ];

                const addonsData = [
                    { item: 'Large Size', willingness: 96, price: '+$1.00' },
                    { item: 'Extra Shot', willingness: 87, price: '+$0.50' },
                    { item: 'Iced Version', willingness: 73, price: '+$1.00' },
                    { item: 'Alt Milk', willingness: 68, price: '+$0.50' }
                ];

                // --- UI COMPONENTS ---
                const Card = ({ title, subtitle, children, className = "" }) => (
                    <div className={`bg-white p-10 border border-gray-200 rounded-sm shadow-sm transition-all hover:shadow-xl ${className}`}>
                        <h3 className="text-sm font-black uppercase tracking-[0.2em] text-charcoal mb-1">{title}</h3>
                        {subtitle && <p className="text-[11px] uppercase text-gray-400 font-bold mb-8 tracking-widest italic">{subtitle}</p>}
                        {children}
                    </div>
                );

                const Stat = ({ label, value, sub, color = '#2A2A2A', size = "text-7xl" }) => (
                    <div className="flex flex-col">
                        <span className="text-[10px] uppercase font-black tracking-widest opacity-60 mb-3">{label}</span>
                        <span className={`${size} font-black tracking-tighter leading-none`} style={{ color }}>{value}</span>
                        {sub && <span className="text-[13px] mt-4 uppercase font-black text-charcoal tracking-tight">{sub}</span>}
                    </div>
                );

                return (
                    <div className="min-h-screen bg-cream">
                        {/* HEADER */}
                        <header className="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
                            <div className="max-w-7xl mx-auto px-10 py-10 flex justify-between items-end">
                                <div className="flex items-center gap-6">
                                    <div className="w-16 h-16 bg-prblue flex items-center justify-center rounded-sm text-white"><Coffee size={32}/></div>
                                    <div>
                                        <h1 className="text-4xl font-black uppercase italic leading-none tracking-tighter">Pablo & Rusty's</h1>
                                        <p className="text-[12px] tracking-[0.4em] uppercase text-prblue font-black mt-3">2026 Cafe and Coffee Insights Report</p>
                                    </div>
                                </div>
                                <div className="hidden md:block text-[11px] font-black uppercase tracking-widest opacity-40 border-l border-gray-200 pl-10 text-right">
                                    Survey Sample: N:750 <br/> Cycle: Q1 2026 Wave
                                </div>
                            </div>
                            <nav className="max-w-7xl mx-auto px-10 flex overflow-x-auto no-scrollbar border-t border-gray-100 bg-white">
                                {[
                                    {id: 'intro', label: 'Introduction', icon: Info},
                                    {id: 'audiences', label: 'Audience Profiles', icon: UserCheck},
                                    {id: 'summary', label: 'Market Pulse', icon: TrendingUp},
                                    {id: 'deep', label: 'Deep Analytics', icon: BarChart3},
                                    {id: 'pricing', label: 'Price & Value', icon: DollarSign},
                                    {id: 'rituals', label: 'Rituals', icon: Search},
                                    {id: 'final', label: 'Verdict', icon: ShieldCheck}
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-3 px-8 py-6 border-b-4 transition-all shrink-0 ${activeTab === tab.id ? 'border-prblue text-prblue' : 'border-transparent text-gray-400 hover:text-charcoal'}`}
                                    >
                                        <tab.icon size={18} /><span className="text-[11px] uppercase tracking-widest leading-none font-black">{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </header>

                        <main className="max-w-7xl mx-auto px-10 py-20">

                            {/* SECTION 1: INTRODUCTION */}
                            {activeTab === 'intro' && (
                                <div className="animate-fade-in max-w-5xl space-y-16">
                                    <h2 className="text-[10rem] font-black uppercase tracking-tighter leading-[0.85] text-charcoal">The Structural <br/> <span className="text-prblue italic underline decoration-[16px] underline-offset-[20px]">Inflection.</span></h2>
                                    <p className="text-3xl leading-relaxed font-medium text-charcoal max-w-4xl">This wave analyses the critical shift in the Australian coffee landscape between 2025 and 2026, decoding the impact of hybrid work, inflation, and Gen Z ritual dominance.</p>
                                    <div className="bg-white p-20 border-l-[24px] border-prblue shadow-2xl relative">
                                        <p className="italic font-black text-5xl text-charcoal leading-tight tracking-tighter">"We are moving from a growth by volume market to a growth by indulgence market. Consumers are trading frequency for intensity, demanding much higher specialty value when they do visit a venue."</p>
                                        <div className="absolute top-4 right-12 text-prblue opacity-5 italic font-serif text-[15rem] leading-none select-none">"</div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12 pt-10">
                                        <div className="p-12 bg-prblue text-white rounded-sm shadow-xl hover:scale-[1.02] transition-transform"><h4 className="font-black uppercase tracking-widest text-xs opacity-60 mb-6 border-b border-white/20 pb-4">Research Objective</h4><p className="text-2xl font-black">Identify the 'Specialty Enthusiast' profile and map the structural shift from Cafe:led to Home:led rituals.</p></div>
                                        <div className="p-12 bg-white border border-gray-200 rounded-sm hover:scale-[1.02] transition-transform"><h4 className="font-black uppercase tracking-widest text-xs opacity-60 mb-6 border-b border-gray-100 pb-4 text-charcoal">Statistical Weighting</h4><p className="text-2xl font-black text-charcoal">Analysed against ABS 2025 marginals (State x Age x Gender) to ensure true representation of the 750 respondents.</p></div>
                                    </div>
                                    <button onClick={() => setActiveTab('audiences')} className="bg-prblue text-white px-16 py-8 text-lg font-black uppercase tracking-[0.2em] hover:bg-black transition-all flex items-center gap-8 shadow-2xl">Enter Audience Analysis <ArrowRight size={28} /></button>
                                </div>
                            )}

                            {/* SECTION 2: AUDIENCE PROFILES */}
                            {activeTab === 'audiences' && (
                                <div className="space-y-20 animate-fade-in">
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-12">
                                        <Card title="Audience Breakdown" subtitle="Distribution across N:750 segment" className="lg:col-span-2">
                                            <div className="chart-container">
                                                <ResponsiveContainer>
                                                    <BarChart data={segmentData} layout="vertical" margin={{ left: 100, right: 40 }}>
                                                        <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke="#F0F0F0" />
                                                        <XAxis type="number" hide />
                                                        <YAxis dataKey="name" type="category" width={220} tick={{fontSize: 14, fontWeight: '900', fill: '#1C355E'}} axisLine={false} tickLine={false} />
                                                        <Tooltip cursor={{fill: '#FDF9F3'}} formatter={(v) => [`${v}%`, 'Market Share']} />
                                                        <Bar dataKey="value" radius={[0, 6, 6, 0]} barSize={50}>
                                                            {segmentData.map((e, i) => (<Cell key={i} fill={i === 0 ? '#1C355E' : i === 4 ? '#B94723' : '#2A2A2A'} />))}
                                                        </Bar>
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </Card>
                                        <Card title="The Growth Anchor" className="border-4 border-prblue p-12 flex flex-col justify-center text-center bg-white shadow-2xl">
                                            <Stat label="Core Sample Target" value="27%" sub="Specialty Enthusiasts" color="#1C355E" size="text-9xl" />
                                            <p className="text-xl mt-12 font-black uppercase tracking-tighter leading-tight text-prblue border-t border-gray-100 pt-8">The only segment showing NET positive spending intent for cafes in 2026.</p>
                                        </Card>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-5 gap-8">
                                        {segmentData.map((seg, i) => (
                                            <div key={i} className="p-10 bg-white border border-gray-100 rounded-sm hover:border-prblue transition-all group shadow-sm">
                                                <div className="text-5xl font-black text-prblue mb-4">{seg.value}%</div>
                                                <h4 className="text-[12px] font-black uppercase mb-6 border-b pb-4 tracking-widest h-12 leading-tight">{seg.name}</h4>
                                                <p className="text-sm leading-relaxed font-bold text-charcoal opacity-70 italic">{seg.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* SECTION 3: MARKET PULSE */}
                            {activeTab === 'summary' && (
                                <div className="space-y-16 animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                        <Card title="1. Cafe Spend Shift" subtitle="Forward trajectory for venue revenue">
                                            <div className="chart-container">
                                                <ResponsiveContainer>
                                                    <BarChart data={[scissorData[0]]} margin={{top: 20, bottom: 20}}>
                                                        <Bar dataKey="direction" radius={4} fill={PR_COLORS.rust} barSize={120} />
                                                        <Tooltip formatter={(v) => `${v}%`} />
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                            <p className="text-lg font-black italic mt-10 text-center text-rust">Cafe spending is down NET 13% as consumers rationalise discretionary spend.</p>
                                        </Card>
                                        <Card title="2. Home Spend Shift" subtitle="Forward trajectory for retail beans">
                                            <div className="chart-container">
                                                <ResponsiveContainer>
                                                    <BarChart data={[scissorData[1]]} margin={{top: 20, bottom: 20}}>
                                                        <Bar dataKey="direction" radius={4} fill={PR_COLORS.blue} barSize={120} />
                                                        <Tooltip formatter={(v) => `${v}%`} />
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                            <p className="text-lg font-black italic mt-10 text-center text-prblue">Home Specialty beans and pods are surging by NET 28%.</p>
                                        </Card>
                                    </div>
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-12">
                                        <Card title="Visitation Rituals"><div className="space-y-12 py-6"><Stat label="3. Cafe Near Home" value="46%" sub="The Primary Weekday Hub" color="#1C355E" /><Stat label="4. Workplace Cafe" value="33%" sub="Declining vs Hybrid Work" color="#2A2A2A" /></div></Card>
                                        <Card title="Market Parity"><div className="space-y-12 py-6"><Stat label="5. Home Espresso" value="44%" sub="Usage at Parity with Cafes" color="#1C355E" /><Stat label="6. Pod Utilisation" value="31%" sub="The Convenience Baseline" color="#2A2A2A" /></div></Card>
                                        <div className="bg-prblue p-12 text-white flex flex-col justify-center rounded-sm shadow-2xl relative overflow-hidden">
                                            <Zap className="mb-8 text-gold relative z-10" size={56} />
                                            <h4 className="text-xs font-black uppercase tracking-widest mb-6 italic opacity-70 relative z-10">Economic Visual Check</h4>
                                            <p className="text-2xl font-black italic leading-tight relative z-10">The 'Scissor' pattern is accelerating: 1 in 10 customers are cutting cafe spend while increasing home bean purchases simultaneously.</p>
                                            <div className="absolute -bottom-10 -right-10 opacity-5 rotate-12"><Coffee size={300} /></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* SECTION 4: DEEP ANALYTICS (FULL 10 CHARTS) */}
                            {activeTab === 'deep' && (
                                <div className="space-y-20 animate-fade-in">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                                        <Card title="The Generational Pivot" subtitle="Drink Temperature Preference by Age Group">
                                            <div className="chart-container">
                                                <ResponsiveContainer>
                                                    <BarChart data={generationalShift}>
                                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                                        <XAxis dataKey="age" tick={{fontSize: 12, fontWeight: 'bold'}} />
                                                        <YAxis hide />
                                                        <Tooltip formatter={(v) => `${v}%`} />
                                                        <Legend wrapperStyle={{paddingTop: '20px'}} />
                                                        <Bar name="Hot Preference" dataKey="hot" fill={PR_COLORS.charcoal} radius={[4, 4, 0, 0]} />
                                                        <Bar name="Cold Preference" dataKey="cold" fill={PR_COLORS.blue} radius={[4, 4, 0, 0]} />
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                            <p className="mt-10 text-sm font-bold text-charcoal italic border-t pt-6">Insight: Gen Z (18 to 24) is the first generation to prefer cold coffee over hot, representing a fundamental shift in workflow requirements.</p>
                                        </Card>
                                        <Card title="The Global Anchor Effect" subtitle="Willingness to pay (Standard vs Post-Benchmark context)">
                                            <div className="chart-container">
                                                <ResponsiveContainer>
                                                    <AreaChart data={anchorEffect}>
                                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                                        <XAxis dataKey="price" tick={{fontWeight: 'bold'}} />
                                                        <YAxis hide />
                                                        <Tooltip formatter={(v) => `${v}%`} />
                                                        <Area name="Standard W.T.P" type="monotone" dataKey="before" stroke={PR_COLORS.charcoal} fill={PR_COLORS.charcoal} fillOpacity={0.1} strokeWidth={4} />
                                                        <Area name="Post Global Benchmark" type="monotone" dataKey="after" stroke={PR_COLORS.blue} fill={PR_COLORS.blue} fillOpacity={0.3} strokeWidth={4} />
                                                    </AreaChart>
                                                </ResponsiveContainer>
                                            </div>
                                            <p className="mt-10 text-sm font-bold text-charcoal italic border-t pt-6">Insight: Sharing global pricing benchmarks ($9 to $15 AUD) increases local price tolerance by 35pp at the $6.00 price point.</p>
                                        </Card>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-12">
                                        <Card title="Spend vs Financial Status" subtitle="Intended spend by household pressure">
                                            <div className="chart-container" style={{height: '250px'}}>
                                                <ResponsiveContainer>
                                                    <BarChart data={pressureData} layout="vertical" margin={{left: 20}}>
                                                        <YAxis dataKey="status" type="category" width={110} tick={{fontSize: 10, fontWeight: 'bold'}} axisLine={false} />
                                                        <Tooltip formatter={(v) => `${v}%`} />
                                                        <Bar dataKey="trajectory" radius={[0, 4, 4, 0]}>
                                                            {pressureData.map((e, i) => <Cell key={i} fill={e.trajectory > 0 ? PR_COLORS.blue : PR_COLORS.rust} />)}
                                                        </Bar>
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </Card>
                                        <Card title="Equipment Adoption Radar" subtitle="Specialty Enthusiasts vs Convenience Baseline">
                                            <div className="chart-container" style={{height: '250px'}}>
                                                <ResponsiveContainer>
                                                    <RadarChart cx="50%" cy="50%" outerRadius="80%" data={equipmentRadar}>
                                                        <PolarGrid />
